name: Build PvzFmimic

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository and libraries
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build PvzFmimic.dll
        run: dotnet build PvzFmimic.csproj --configuration Release --verbosity minimal

      - name: Upload mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: PvzFmimic
          path: bin/Release/net6.0/PvzFmimic.dll
          if-no-files-found: error
          retention-days: 30
